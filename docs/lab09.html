<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab09 Motion Trainer</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #f2f6ff);
            color: #1a2b4c;
        }

        header {
            background: white;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        header h1 {
            font-size: 34px;
            font-weight: 600;
            color: #0d47a1;
        }

        header h3 {
            font-weight: 400;
            margin-top: 10px;
            color: #444;
        }

        .section {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(13, 71, 161, 0.08);
            text-align: center;
        }

        /* ===== กรอบมือถือ ===== */
        .phone-frame {
            width: 320px;
            aspect-ratio: 9/16;
            /* สัดส่วนมือถือ */
            margin: 30px auto;
            padding: 14px;
            background: black;
            border-radius: 40px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        /* หน้าจอมือถือ */
        .phone-frame iframe {
            width: 100%;
            height: 100%;
            border-radius: 28px;
            border: none;
        }

        /* ===== ปุ่ม ===== */
        button {
            margin-top: 30px;
            background: #0d47a1;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1565c0;
            transform: scale(1.05);
        }

        /* ===== รูปภาพ ===== */
        .extra-content {
            max-height: 0;
            overflow: hidden;
            transition: all 0.6s ease;
            margin-top: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .card {
            background: #f9fbff;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .card img {
            width: 100%;
            border-radius: 15px;
        }

        .card p {
            margin-top: 10px;
            font-weight: 500;
            color: #0d47a1;
        }

        .extra-content.show {
            max-height: 2000px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Lab09 Ionic + Mobile Phone Sensors</h1>
        <h3>673380015-1 ณัฏฐณิชา โยธะคง</h3>
        <p>แอปพลิเคชันนับรอบการยกแขน พร้อมเสียงแนะนำอัตโนมัติ</p>
    </header>

    <div class="section">
        <h2>วิดีโอสาธิตการใช้งาน (ประมาณ 1 นาที)</h2>

        <!-- กรอบมือถือ -->
        <div class="phone-frame">
            <iframe src="https://drive.google.com/file/d/1BHEJYny5YbVB-MpkZmQ0bc2KwOjZS7lt/preview" allow="autoplay">
            </iframe>
        </div>

        <button onclick="toggleContent()">ดูตัวอย่างหน้าจอ</button>

        <div class="extra-content" id="moreContent">
            <div class="gallery">

                <div class="card">
                    <img src="IMG_3048.JPG">
                    <p>1️⃣ หน้าเริ่มต้น (ก่อนกด Start)</p>
                </div>

                <div class="card">
                    <img src="IMG_3051.JPG">
                    <p>2️⃣ หน้าขณะกำลังนับรอบ</p>
                </div>

                <div class="card">
                    <img src="IMG_3052.JPG">
                    <p>3️⃣ หน้าจบการนับและแสดงสถิติ</p>
                </div>

            </div>
        </div>
    </div>

    <script>
        function toggleContent() {
            const content = document.getElementById("moreContent");
            content.classList.toggle("show");
        }
    </script>

</body>

</html>
