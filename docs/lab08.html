<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8 การพัฒนาแอปด้วย Ionic ร่วมกับ Firebase AI Logic</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family: 'Kanit', sans-serif;
    background:#f2f6ff;
    color:#1a2b4c;
}

header{
    background:white;
    padding:60px 20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

header h1{
    font-size:32px;
    font-weight:600;
    color:#0d47a1;
}

.section{
    max-width:900px;
    margin:50px auto;
    padding:70px;
    background:white;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(13,71,161,0.08);
}

video{
    width:100%;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

button{
    margin-top:25px;
    background:#0d47a1;
    color:white;
    border:none;
    padding:12px 28px;
    border-radius:50px;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1565c0;
    transform:scale(1.05);
}

/* รูปที่ซ่อนไว้ */
.extra-content{
    max-height:0;
    overflow:hidden;
    transition:all 0.6s ease;
    display:grid;
    grid-template-columns: repeat(2, 1fr); /* 2 รูปต่อแถว */
    gap:20px;
    margin-top:20px;
}

.extra-content img{
    width:100%;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    transition:0.3s;
}

.extra-content img:hover{
    transform:scale(1.05);
}

.extra-content.show{
    max-height:1000px;
}
</style>
</head>

<body>

<header>
    <h1>การพัฒนาแอปด้วย Ionic ร่วมกับ Firebase AI Logic</h1>
    <p>Modern App Development  • Smart AI Integration</p>
</header>

<div class="section">
   <h2>ตัวอย่างการทำงานของระบบที่พัฒนาด้วย Ionic และเชื่อมต่อ Firebase พร้อม AI Logic</h2>

    <video controls>
        <source src="lab08.mp4" type="video/mp4">
    </video>

    <button onclick="toggleContent()">ดูรายละเอียดเพิ่มเติม</button>

    <!-- รูปที่จะแสดงเมื่อกด -->
    <div class="extra-content" id="moreContent">
        <img src="dog2.png" alt="">
        <img src="junkkok.png" alt="">
        <img src="ส้มตำ.png" alt="">
        <img src="ชานม.png" alt="">
    </div>
</div>

<script>
function toggleContent(){
    const content = document.getElementById("moreContent");
    content.classList.toggle("show");
}
</script>

</body>
</html>
